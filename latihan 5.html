<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Contoh Box Model</title>
    <style>
        body {
            background-color: #f4f6f7;
            font-family: sans-serif;
        }

        .kartu-profil {
            background-color: #ffffff;
            width: 300px;
            
            /* Box Model Styling */
            padding: 25px;      /* Jarak isi teks ke garis tepi kotak */
            margin: 40px auto;  /* Jarak luar kotak dan posisi tengah */
            border: 2px solid #dcdde1; /* Garis tepi tipis abu-abu */
        }
    </style>
</head>
<body>

    <div class="kartu-profil">
        <h2>Kartu Profil</h2>
        <p>Kotak ini diatur menggunakan padding, margin, dan border agar tampak rapi seperti kartu digital.</p>
    </div>

</body>
</html>
