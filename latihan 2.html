<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Mengenal Variabel dan Tipe Data</h2>
    <script>
        let namaSiswa = "Ahmad";
        let umur = 16;
        let nilaiRataRata = 88.5;
        let isHadir = true;

        document.write("Nama Siswa: " + namaSiswa + "<br>");
        document.write("Umur: " + umur + " Tahun<br>");
        document.write("Nilai Rata-Rata: " + nilaiRataRata + "<br>");
        document.write("Status Kehadiran: " + isHadir + "<br>");

        umur = 17;

        document.write("<hr>");
        document.write("Umur terbaru: " + umur + " Tahun");
    </script>
</body>
</html>
