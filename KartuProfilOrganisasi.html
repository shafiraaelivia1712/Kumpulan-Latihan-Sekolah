<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Studi Kasus - Kartu Profil Anggota</title>
    <style>
        body {
            background-color: #f7f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #kartu-anggota {
            width: 320px;
            background-color: #ffffff;
            margin: 60px auto;
            padding: 25px;
            border: 1px solid #d1d8e0;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .avatar-box {
            width: 90px;
            height: 90px;
            background-color: #e67e22;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 90px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
        }

        h3 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .jabatan {
            color: #e67e22;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .bio {
            color: #7f8c8d;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .btn-profil {
            display: inline-block;
            background-color: #34495e;
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .btn-profil:hover {
            background-color: #2c3e50;
        }
    </style>
</head>
<body>

    <div id="kartu-anggota">
        <div class="avatar-box">OSIS</div>
        <h3>Siti Aminah</h3>
        <div class="jabatan">Koordinator Bidang IT</div>
        <p class="bio">Aktif mengembangkan kreativitas digital dan pengelolaan web organisasi di sekolah.</p>
        <a href="#" class="btn-profil">Lihat Detail</a>
    </div>

</body>
</html>
