<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Pengecekan Beasiswa</h2>
    <script>
        let nilaiIPK = Number(prompt("Nilai IPK : "));
        let status = "";

        if (nilaiIPK >= 3.5 && nilaiIPK <= 4.00) {
            status = "Layak Mendapatkan Beasiswa";
        } else {
            status = "Belum Memenuhi Syarat";
        }

        document.write("Nilai IPK : " + nilaiIPK + "<br>");
        document.write("Status : <b>" + status + "</b>");
    </script>
</body>
</html>
