<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <h2>Validasi Login</h2>
    <script>
        let password = prompt("Masukkan Password: ");
        let akses = "";

        if (password === "admin123") {
            akses = "Login Berhasil (Akses Diterima)";
        } else {
            akses = "Login Gagal (Password Salah)";
        }

        document.write("Status : <b>" + akses + "</b>");
    </script>
</body>
