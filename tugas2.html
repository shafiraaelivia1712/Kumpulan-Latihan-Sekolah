<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas 2 - Perulangan</title>
</head>
<body>
    <script>
        for (let i = 1; i <= 10; i++) {
            document.write(i + ". Saya Berjanji Akan Rajin Belajar Coding <br>");
        }
        document.write("<br>");

        for (let i = 2; i <= 20; i += 2) {
            document.write(i + " ");
        }
        document.write("<br>");
        document.write("<br>");

        for (let i = 1; i <= 30; i++) {
            document.write("*");
        }
    </script>
</body>
</html>
