<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Cek Ganjil / Genap</h2>
    <script>
        let angka = Number(prompt("Masukkan sebuah angka : "));
        let hasil = "";

        if (angka % 2 === 0) {
            hasil = "Bilangan Genap";
        } else {
            hasil = "Bilangan Ganjil";
        }

        document.write("Angka: " + angka + "<br>");
        document.write("Jenis: <b>" + hasil + "</b>");
    </script>
</body>
</html>
