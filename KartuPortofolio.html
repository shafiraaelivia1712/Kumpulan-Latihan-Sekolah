<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studi Kasus - Developer Card</title>
    <style>
        body {
            background-color: #0b1021;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #developer-card {
            background-color: #111827;
            width: 360px;
            padding: 35px 25px;
            border: 1px solid #1f293d;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .dev-icon {
            width: 80px;
            height: 70px;
            background-color: #e11d48;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            margin: 0 auto 20px auto;
        }

        h3 {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        .jabatan {
            color: #ef4444;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .bio {
            color: #9ca3af;
            font-size: 13.5px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-github {
            display: inline-block;
            background-color: #1d4ed8;
            color: #ffffff;
            text-decoration: none;
            padding: 9px 24px;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: background-color 0.2s ease;
        }

        .btn-github:hover {
            background-color: #1e40af;
        }
    </style>
</head>
<body>

    <div id="developer-card">
        <div class="dev-icon">&lt;/&gt; RPL</div>
        <h3>Auwia RIza</h3>
        <div class="jabatan">Ex Member JKT48</div>
        <p class="bio">Dulu Member Idol, Sekarang Streamer    </p>
        <a href="https://github.com/shafiraaelivia1712" class="btn-github">GitHub Profile</a>
    </div>

</body>
</html>
